name: Deploy TypeWit staging (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typewit-staging-deployment
  cancel-in-progress: false
jobs:
  deploy-staging:
    if: github.ref_name == 'feature/typewit-independent-enhancements'
    runs-on: ubuntu-latest
    environment: typewit-staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify isolated staging source
        run: node --test tests/typewit-*.test.mjs
      - name: Compile staging Worker
        run: CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=./wrangler.staging.jsonc npm run build
      - name: Block deployment with unsafe bindings
        run: node scripts/verify-typewit-staging-output.mjs
      - name: Verify staging-only credential is configured
        env:
          CF_STAGING_TOKEN: ${{ secrets.CF_TYPEWIT_STAGING_API_TOKEN }}
        run: |
          if [ -z "$CF_STAGING_TOKEN" ]; then
            echo "::error::Missing CF_TYPEWIT_STAGING_API_TOKEN environment secret."
            exit 1
          fi
      - name: Apply migrations to staging D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TYPEWIT_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_TYPEWIT_STAGING_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.staging.jsonc
      - name: Deploy staging only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TYPEWIT_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_TYPEWIT_STAGING_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json

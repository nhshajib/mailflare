name: Deploy TypeWit staging (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typewit-staging-deployment
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/typewit-checks.yml
  deploy-staging:
    needs: checks
    if: github.ref_name == 'feature/typewit-independent-enhancements'
    runs-on: ubuntu-latest
    environment: typewit-staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify isolated staging source
        run: node --test tests/typewit-*.test.mjs
      - name: Compile staging Worker
        run: CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=./wrangler.staging.jsonc npm run build
      - name: Block deployment with unsafe bindings
        run: node scripts/verify-typewit-staging-output.mjs
      - name: Verify staging account target and prohibit provider secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_TYPEWIT_STAGING_ACCOUNT_ID }}
        run: |
          if [ "$CLOUDFLARE_ACCOUNT_ID" != "a23bb81df9913653447e932debbe887c" ]; then
            echo "::error::Cloudflare account ID does not match the verified staging resource owner"
            exit 1
          fi
          if [ -n "${CF_TOKEN:-}" ] || [ -n "${CF_API_KEY:-}" ] || [ -n "${RESEND_API_KEY:-}" ]; then
            echo "::error::Runtime production/provider email credentials must not be in staging job environment"
            exit 1
          fi
      - name: Verify staging deployment credential is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TYPEWIT_STAGING_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing staging deployment token"
            exit 1
          fi
      - name: Apply migrations to isolated staging D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TYPEWIT_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_TYPEWIT_STAGING_ACCOUNT_ID }}
        run: npx --no-install wrangler d1 migrations apply DB --remote --config wrangler.staging.jsonc
      - name: Deploy isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TYPEWIT_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_TYPEWIT_STAGING_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config dist/server/wrangler.json
